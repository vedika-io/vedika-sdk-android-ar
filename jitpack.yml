# JitPack configuration for Android AR 1.1.1 — the
# ARCore-native companion to `sdks/android`. JitPack's default build image
# sets `ANDROID_HOME` (`/opt/android-sdk-linux`) but ships NO platform
# under it — only `platform-tools/build-tools/tools` — so the platform
# jar Gradle's compile classpath requires (compileSdk 35 per
# `sdks/android-ar/build.gradle.kts`) and that `verifyArPackagingSdk` in
# the consumed `io.vedika:vedika-android-sdk:1.1.0` checks for (any of
# 34/35/36) must be installed before the gradle build runs. The bundled
# `tools/bin/sdkmanager` predates Android-Gradle 8.5.2 and may refuse
# the platform 35 repository entry, so this first tries the bundled
# sdkmanager, then falls back to a freshly downloaded `cmdline-tools`
# sdkmanager pointed at the SAME `$ANDROID_HOME` via `--sdk_root`, so
# the platform lands exactly where Gradle already looks for it (the env
# exported here does NOT carry over to Gradle's own shell — they are
# separate invocations).
#
# NOTE: publish / signing credentials are deliberately NOT handled here.
# Token retrieval for any operator-side publish step is out of scope for
# this file and is read by the build itself from outside sources.
before_install:
  - yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses > /tmp/sdk_lic_old.log 2>&1; true
  - $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-35" > /tmp/sdk_install_old.log 2>&1; tail -40 /tmp/sdk_install_old.log; true
  - test -f "$ANDROID_HOME/platforms/android-35/android.jar" && echo "OLD_SDKMANAGER_OK" || echo "OLD_SDKMANAGER_INSUFFICIENT"
  - bash -c 'if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then mkdir -p /tmp/cmdline-tools-fresh && curl -sL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip && unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-fresh && yes | /tmp/cmdline-tools-fresh/cmdline-tools/bin/sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /tmp/sdk_lic_new.log 2>&1; /tmp/cmdline-tools-fresh/cmdline-tools/bin/sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" > /tmp/sdk_install_new.log 2>&1; tail -40 /tmp/sdk_install_new.log; fi; true'
  - test -f "$ANDROID_HOME/platforms/android-35/android.jar" && echo "ANDROID_PLATFORM_READY" || echo "ANDROID_PLATFORM_MISSING"
jdk:
  - openjdk17
install:
  - ./gradlew --no-daemon --max-workers=2 test assembleRelease publishToMavenLocal
